<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật</title>
    <script src="gate.js"></script>
    <script src="shell.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    <meta name="description" content="Có một món quà nhỏ đang đợi Quỳnh Bếuu mở nè 💝">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quynhbeuu.onrender.com/">
    <meta property="og:title" content="Happy Birthday Quỳnh Bếuu 🎂">
    <meta property="og:description" content="Có một món quà nhỏ đang đợi em mở nè 💝">
    <meta property="og:image" content="https://quynhbeuu.onrender.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#FFC8D8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor"></div>

    <!-- Màn hình chờ mở quà -->
    <div class="intro-overlay">
        <div class="intro-content">
            <div class="gift-box">🎁</div>
            <h2>Có một bất ngờ dành riêng cho đồ ham ăn...</h2>
            <button class="open-gift-btn candy jelly">Mở Quà Ngay! 💝</button>
            <p class="sound-hint">🔊 Lưu ý nhỏ: Gạt nút chuông nếu dùng iPhone nha!</p>
        </div>
    </div>

    <!-- Tiệc sinh nhật: băng rôn & bong bóng (celebrate.js dựng nội dung) -->
    <div class="bunting" data-text="HAPPY BIRTHDAY"></div>
    <div class="balloons" data-count="9"></div>

    <div class="container">
        <button class="cake jelly" type="button" aria-label="Thổi nến bánh sinh nhật">
            <span class="candles">
                <i class="candle"><b class="flame"></b></i>
                <i class="candle"><b class="flame"></b></i>
                <i class="candle"><b class="flame"></b></i>
            </span>
            <span class="cake-top"></span>
            <span class="cake-bottom"></span>
            <span class="plate"></span>
        </button>
        <p class="cake-hint">Bấm vào bánh để thổi nến nha 🕯️</p>
        <h1>
            <span class="h1-top">Happy Birthday</span>
            <span class="h1-name">Quỳnh Bếuu</span>
            <span class="h1-emoji">💗</span>
        </h1>
        <div class="greeting"></div>
        <div class="jelly-wrap jelly">
            <button class="cta-button candy">Bấm để khám phá thế giới của chúng mình 💕</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="cursor-trail.js"></script>
    <script src="sfx.js"></script>
    <script src="celebrate.js"></script>
    <script src="nav.js"></script>
    <script src="music.js"></script>
    <script src="typing.js"></script>
</body>
</html>

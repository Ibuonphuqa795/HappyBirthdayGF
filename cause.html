<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Chúc Cho Quỳnh Bếuu 💌</title>
    <script src="gate.js"></script>
    <script src="shell.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./cause.css">
</head>
<body>
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#FF8FB1" stroke="#fff" stroke-width="2" stroke-linejoin="round" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <div class="container">
        <h1>
            <span class="h1-top">Happy Birthday</span>
            <span class="h1-name">Quỳnh Bếuu</span>
            <span class="h1-emoji">💖</span>
        </h1>

        <div id="reasons-container"></div>

        <div class="jelly-wrap jelly">
            <button class="shuffle-button candy">Bấm vào đây nè... 💕</button>
        </div>
        <div class="reason-counter"></div>

        <div class="ending-section">
            <div class="teddy-hug">
                <img src="./d1.png" alt="Teddy Hug">
            </div>
            <div class="ending-text">Thương Quỳnh Bếuu nhất trên đời! 💖</div>
        </div>
    </div>

    <script src="cause.js"></script>
    <script src="cursor-trail.js"></script>
    <script src="sfx.js"></script>
    <script src="nav.js"></script>
    <script src="music.js"></script>
</body>
</html>
